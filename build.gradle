plugins {
    id 'java'
}

// Project information
group = 'com.frostwire'
version = '1.0'

// Java version compatibility
java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

// Configure compile options to handle internal package access
compileJava {
    options.compilerArgs += [
        '--add-exports', 'java.desktop/java.awt.peer=ALL-UNNAMED',
        '--add-exports', 'java.desktop/java.awt=ALL-UNNAMED'
    ]
    // Continue on error to allow jar task to run for demonstration
    options.failOnError = false
}

// Configure source sets to match existing directory structure
sourceSets {
    main {
        java {
            srcDirs = ['src/os_stub', 'src/java']  // Order matters - stubs first
        }
    }
}

// JAR configuration to match the original build
jar {
    archiveFileName = 'fw-jwebbrowser.jar'
    destinationDirectory = file('dist')
}

// Task to copy native libraries (equivalent to the copy tasks in build.xml)
task copyNativeLibs(type: Copy) {
    from 'JIExplorer.dll'
    from 'libJWebKit.dylib'
    into 'dist'
}

// Make jar depend on copying native libraries
jar.dependsOn copyNativeLibs

// Task to clean build artifacts (equivalent to clean target in build.xml)
clean {
    delete 'bin'
    delete 'dist'
}

// Default task equivalent to the 'jar' target in build.xml
defaultTasks 'jar'